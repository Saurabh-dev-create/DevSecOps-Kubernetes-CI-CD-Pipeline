apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limited-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limited-binding
subjects:
- kind: ServiceAccount
  name: vulnerable-sa
roleRef:
  kind: Role
  name: limited-role
  apiGroup: rbac.authorization.k8s.io