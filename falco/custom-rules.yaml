- rule: Shell Spawned in Container
  desc: Detect a shell process started inside a container
  condition: >
    evt.type in (execve, execveat)
    and container.id != host
    and proc.name in (bash, sh, ash, zsh)
  output: >
    Shell spawned inside container
    user=%user.name
    container=%container.name
    image=%container.image.repository
    shell=%proc.name
    command=%proc.cmdline
    parent=%proc.pname
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: WARNING
  tags: [container, shell, kubernetes]

- rule: Write Below Etc In Container
  desc: Detect attempts to write files under /etc inside a container
  condition: >
    evt.type in (open, openat, openat2)
    and evt.is_open_write=true
    and fd.typechar='f'
    and container.id != host
    and fd.name startswith /etc
  output: >
    File written below /etc inside container
    user=%user.name
    file=%fd.name
    container=%container.name
    image=%container.image.repository
    process=%proc.name
    command=%proc.cmdline
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: WARNING
  tags: [container, filesystem, kubernetes]

- rule: Unexpected Package Manager in Container
  desc: Detect package manager execution inside a container
  condition: >
    evt.type in (execve, execveat)
    and container.id != host
    and proc.name in (apt, apt-get, apk, yum, dnf)
  output: >
    Package manager executed inside container
    user=%user.name
    container=%container.name
    image=%container.image.repository
    process=%proc.name
    command=%proc.cmdline
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: WARNING
  tags: [container, process, kubernetes]
